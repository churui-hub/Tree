<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二胡体验 - 卡片2 部件识别</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5ede1 0%, #faf7f2 100%);
            color: #4a3728;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
        }

        .image-container {
            flex: 1;
            position: relative;
            flex-shrink: 0;
        }

        .erhu-diagram {
            width: 100%;
            max-width: 350px;
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
            border-radius: 8px;
            animation: fadeInLeft 1s ease-out;
        }

        .clickable-zone {
            position: absolute;
            cursor: pointer;
            background: rgba(196, 168, 120, 0.2);
            border: 2px dashed #c4a878;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .clickable-zone:hover {
            background: rgba(196, 168, 120, 0.4);
        }

        .clickable-zone.active {
            background: rgba(196, 168, 120, 0.6);
            box-shadow: 0 0 15px rgba(196, 168, 120, 0.5);
        }

        .content-section {
            flex: 1;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #5d4a37;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .card-subtitle {
            font-size: 1rem;
            color: #9b8b7e;
            margin-bottom: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .question-box {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #c4a878;
            margin-bottom: 1.5rem;
            display: none;
        }

        .question-box.active {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .question-text {
            font-size: 1.1rem;
            color: #5d4a37;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            padding: 1rem;
            border: 2px solid #d4c5b9;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #5d4a37;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .option-btn:hover {
            background: #f5ede1;
            border-color: #c4a878;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: #c4a878;
            color: white;
            border-color: #8b6f47;
        }

        .option-btn.correct {
            background: #8bc34a;
            color: white;
            border-color: #7cb342;
        }

        .option-btn.incorrect {
            background: #e57373;
            color: white;
            border-color: #d32f2f;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .explanation {
            background: #f9f6f1;
            padding: 1.5rem;
            border-radius: 6px;
            margin-top: 1rem;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .explanation.show {
            display: block;
        }

        .explanation-title {
            font-size: 1rem;
            font-weight: 600;
            color: #5d4a37;
            margin-bottom: 0.8rem;
        }

        .explanation-text {
            font-size: 0.95rem;
            color: #7a6b5d;
            line-height: 1.8;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #9b8b7e;
            margin-top: 1rem;
            font-style: italic;
        }

        .scroll-hint {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #9b8b7e;
            animation: bounce 2s infinite;
        }

        .scroll-hint svg {
            width: 28px;
            height: 28px;
            stroke: #c4a878;
            fill: none;
            stroke-width: 2;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(12px);
            }
        }

        @media (max-width: 768px) {
            .card-wrapper {
                flex-direction: column;
                gap: 2rem;
            }

            .card-title {
                font-size: 1.6rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .erhu-diagram {
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

            <div class="explanation" id="explanation">
                <div class="explanation-title">✓ 正确！这是千斤</div>
                <div class="explanation-text">
                    之所以叫千斤，是因为它承托琴弦，仿佛可承载千斤拉力，稳住琴弦的基础张力。
                    <br><br>
                    <strong>它的作用是：</strong>
                    <br>• 划定琴弦有效振动范围
                    <br>• 决定左手按音区域
                    <br>• 高度会直接影响音准
                </div>
            </div>

            <div class="hint-text" id="hintText">
                💡 点击左图中隐去的部分来开始游戏
            </div>

            <div class="scroll-hint">
                <span>向下滚动查看更多</span>
                <svg viewBox="0 0 24 24">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const clickZone = document.getElementById('clickZone');
        const questionBox = document.getElementById('questionBox');
        const explanation = document.getElementById('explanation');
        const hintText = document.getElementById('hintText');
        const diagram = document.getElementById('erhoDiagram');

        let gameStarted = false;
        let answered = false;

        function setupClickZone() {
            const topPercent = 45;
            const leftPercent = 50;
            const sizePercent = 8;
            
            clickZone.style.width = (diagram.offsetWidth * sizePercent / 100) + 'px';
            clickZone.style.height = (diagram.offsetWidth * sizePercent / 100) + 'px';
            clickZone.style.top = (diagram.offsetHeight * topPercent / 100) + 'px';
            clickZone.style.left = (diagram.offsetWidth * leftPercent / 100) + 'px';
            clickZone.style.transform = 'translate(-50%, -50%)';
        }

        clickZone.onclick = function() {
            if (!gameStarted) {
                gameStarted = true;
                clickZone.classList.add('active');
                questionBox.classList.add('active');
                hintText.style.display = 'none';
            }
        };

        window.selectAnswer = function(answer) {
            if (answered) return;
            
            answered = true;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => {
                if (btn.textContent === answer) {
                    if (answer === '千斤') {
                        btn.classList.add('correct');
                        explanation.classList.add('show');
                    } else {
                        btn.classList.add('incorrect');
                    }
                } else if (answer !== '千斤') {
                    if (btn.textContent === '千斤') {
                        btn.classList.add('correct');
                        explanation.classList.add('show');
                    }
                }
                btn.disabled = true;
            });
        };

        setupClickZone();
        window.addEventListener('resize', setupClickZone);
    </script>
</body>
</html>
